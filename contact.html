  <main id="main">
    <section class="section" id="contact">
      <div class="container container--narrow">
        <h1 class="section__title" data-i18n="contact.heading">Have a question?</h1>

        <!-- NOTE: the name="" attributes below are what gets sent to
             Formspree. They stay in English in every language on purpose. -->
        <form class="rsvp-form" id="contact-form" novalidate>
          <div class="hp" aria-hidden="true">
            <label for="contact-gotcha" data-i18n="contact.honeypot">Leave this field empty</label>
            <input type="text" id="contact-gotcha" name="_gotcha" tabindex="-1" autocomplete="off">
          </div>

          <div class="field">
            <label for="contact-name"><span data-i18n="contact.name">Your name</span> <span class="req" aria-hidden="true">*</span></label>
            <input type="text" id="contact-name" name="name" autocomplete="name" required aria-required="true" aria-describedby="contact-name-error">
            <p class="field__error" id="contact-name-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="contact-email"><span data-i18n="contact.email">Your email</span> <span class="req" aria-hidden="true">*</span></label>
            <input type="email" id="contact-email" name="email" autocomplete="email" inputmode="email" required aria-required="true" aria-describedby="contact-email-error">
            <p class="field__error" id="contact-email-error" role="alert"></p>
          </div>

          <div class="field">
            <label for="contact-message"><span data-i18n="contact.message">Your question</span> <span class="req" aria-hidden="true">*</span></label>
            <textarea id="contact-message" name="message" rows="6" required aria-required="true" aria-describedby="contact-message-error"></textarea>
            <p class="field__error" id="contact-message-error" role="alert"></p>
          </div>

          <div class="form-actions">
            <button class="button button--primary" type="submit" id="contact-submit" data-i18n="contact.submit">Send message</button>
            <p class="form-alt">
              <span data-i18n="contact.or">or</span> <a id="contact-mailto" href="mailto:kimkimchinv@gmail.com?subject=Question%20about%20Kim%20%26%20Walter%27s%20wedding" data-i18n="contact.emailUs">email us</a>
            </p>
          </div>

          <div class="form-status" id="contact-status" role="status" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p class="site-footer__names">Kimberly <span class="amp">&amp;</span> Walter</p>
      <p data-i18n="footer.date">Saturday, October 9, 2027 · Nagoya, Japan</p>
